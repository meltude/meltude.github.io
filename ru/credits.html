<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Благодарности и спасибо всем, кто помог с meltude.me"
    />
    <link rel="icon" type="image/png" href="/img/icon.png" />
    <title>JustCredits()</title>
    <link rel="stylesheet" href="../style.css" />
    <link
      rel="preload"
      href="/fonts/mononoki-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="canonical" href="https://meltude.me/ru/credits" />
    <link rel="alternate" hreflang="en" href="https://meltude.me/credits" />
    <link rel="alternate" hreflang="ru" href="https://meltude.me/ru/credits" />
    <link rel="alternate" hreflang="x-default" href="https://meltude.me/credits" />
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="page-shell">
      <div class="topbar-wrap">
        <nav class="workspaces" aria-label="Рабочие столы">
          <a href="/ru/" title="Обзор">1</a>
          <a href="/ru/projects" title="Проекты">2</a>
          <a href="/ru/notes" title="Заметки">3</a>
          <a href="/ru/contact" title="Контакты">4</a>
          <a href="/ru/credits" aria-current="page" title="Благодарности">5</a>
        </nav>
        <div class="lang-switcher lang-switcher--compact lang-switcher--plain">
          <a href="/credits" hreflang="en" lang="en" aria-label="Переключить на английский">EN</a>
        </div>
      </div>

      <div class="layout">
        <main class="content">
          <section
            class="pane-grid"
            aria-label="Благодарности:"
          >
            <div class="section-divider">
              <h3>Благодарности:</h3>
            </div>

            <article class="pane">
              <h3>
                <a
                  href="https://inuhepott.tech/"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Inuhepott <span aria-hidden="true">-&gt;</span></a
                >
              </h3>
            </article>

            <article class="pane">
              <h3>
                <a
                  href="https://samposa_1337.codeberg.page/"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Samposa1337 <span aria-hidden="true">-&gt;</span></a
                >
              </h3>
            </article>
          </section>
        </main>
      </div>
      <footer class="footer footer-badges">
        <div class="badge-row" aria-label="Friend badges">
          <a href="https://inu.vesperlinux.org">
            <img
              src="https://inu.vesperlinux.org/img/inuhepott.webp"
              alt="inuhepott"
              loading="lazy"
            />
          </a>
          <a href="https://nixos.org">
            <img
              src="https://notnite.com/buttons/nixos.png"
              alt="NixOS"
              loading="lazy"
            />
          </a>
          <a href="https://vesperlinux.org">
            <img
              src="https://inu.vesperlinux.org/img/vesperlinux.gif"
              alt="Vesper Linux"
              loading="lazy"
            />
          </a>
          <a href="https://meltude.me">
            <img src="../img/MeltingAsh.webp" alt="meltude.me" loading="lazy" />
          </a>
        </div>
        <img
          class="thanks-art"
          src="../img/thanks.png"
          alt="thanks for everything!"
          loading="lazy"
        />
        <p class="muted">
          <a
            class="text-link"
            href="https://github.com/meltude/meltude.github.io"
            target="_blank"
            rel="noopener"
            >Исходный код</a
          >
          &middot;
          <a
            class="text-link"
            href="https://madmalik.github.io/mononoki/"
            target="_blank"
            rel="noopener"
            >Шрифт</a
          >
        </p>
      </footer>
    </div>
    <script src="../stars.js" defer></script>
  </body>
</html>
