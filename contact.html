<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      data-i18n-content="contact.meta.description"
      content="How to contact Meltude."
    />
    <link rel="icon" type="image/svg+xml" href="icon.png" />
    <title data-i18n="contact.meta.title">MeltudeContacts()</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="preload"
      href="/fonts/mononoki-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div class="page-shell">
      <div class="topbar-wrap">
        <header class="topbar pane">
          <nav aria-label="Main navigation" data-i18n-aria-label="nav.label">
            <a href="index.html" data-i18n="nav.overview">Overview</a>
            <a href="projects.html" data-i18n="nav.projects">Projects</a>
            <a href="notes.html" data-i18n="nav.notes">Notes</a>
            <a href="contact.html" aria-current="page" data-i18n="nav.contact">Contact</a>
            <a href="credits.html" data-i18n="nav.credits">Credits</a>
          </nav>
        </header>
        <div class="lang-switcher lang-switcher--compact pane">
          <button id="lang-toggle" type="button" aria-label="Switch to Russian">
            RU
          </button>
        </div>
      </div>

      <div class="layout">
        <main class="content">
          <section
            class="pane-grid"
            aria-label="Contact links"
            data-i18n-aria-label="contact.aria"
          >
            <div class="section-divider">
              <h3 data-i18n="contact.title">Contacts:</h3>
            </div>
            <article class="pane">
              <h3>Codeberg</h3>
              <a
                class="text-link"
                href="https://codeberg.org/meltude"
                target="_blank"
                rel="noopener noreferrer me"
                >codeberg.org/meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>GitHub</h3>
              <a
                class="text-link"
                href="https://github.com/meltude"
                target="_blank"
                rel="noopener noreferrer me"
                >github.com/meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>Telegram</h3>
              <a
                class="text-link"
                href="https://t.me/meltude"
                target="_blank"
                rel="noopener noreferrer me"
                >t.me/meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>Email</h3>
              <a class="text-link" href="mailto:meltude@proton.me"
                >meltude@proton.me <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>Discord</h3>
              <a
                class="text-link"
                href="https://discord.com/users/1549177447726059524"
                target="_blank"
                rel="noopener noreferrer me"
                >@meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>
                <img
                  class="inline-icon"
                  src="icon.png"
                  alt=""
                  aria-hidden="true"
                />TeamSlag
              </h3>
              <a
                class="text-link"
                href="https://t.me/TeamSlag"
                target="_blank"
                rel="noopener noreferrer"
                ><span data-i18n="contact.teamslag_link">My organization</span>
                <span aria-hidden="true">-&gt;</span></a
              >
            </article>
          </section>
        </main>
      </div>

      <footer class="footer">
        <p class="muted">
          <a
            class="text-link"
            href="https://github.com/meltude/meltude.github.io"
            target="_blank"
            rel="noopener"
            data-i18n="footer.source"
            >Source code</a
          >
          &middot;
          <a
            class="text-link"
            href="https://madmalik.github.io/mononoki/"
            target="_blank"
            rel="noopener"
            data-i18n="footer.font"
            >Font</a
          >
        </p>
      </footer>
    </div>
    <script src="i18n.js" defer></script>
  </body>
</html>
