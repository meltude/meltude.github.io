<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="How to contact Meltude." />
    <link rel="icon" type="image/svg+xml" href="icon.png" />
    <title>MeltudeContacts()</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="preload"
      href="/fonts/mononoki-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

  <body>
    <div class="page-shell">
      <header class="topbar pane">
        <nav aria-label="Main navigation">
          <a href="index.html">Overview</a>
          <a href="projects.html">Projects</a>
          <a href="notes.html">Notes</a>
          <a href="contact.html" aria-current="page">Contact</a>
          <a href="credits.html">Credits</a>
        </nav>
      </header>

      <div class="layout">
        <main class="content">
          <section class="pane-grid" aria-label="Contact links">
            <div class="section-divider">
              <h3>Contacts:</h3>
            </div>
            <article class="pane">
              <h3>GitLab</h3>
              <a
                class="text-link"
                href="https://gitlab.com/meltude"
                target="_blank"
                rel="noopener noreferrer me"
                >gitlab.com/meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>GitHub</h3>
              <a
                class="text-link"
                href="https://github.com/meltude"
                target="_blank"
                rel="noopener noreferrer me"
                >github.com/meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>Telegram</h3>
              <a
                class="text-link"
                href="https://t.me/meltude"
                target="_blank"
                rel="noopener noreferrer me"
                >t.me/meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>Email</h3>
              <a class="text-link" href="mailto:meltude@proton.me"
                >meltude@proton.me <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>Discord</h3>
              <a
                class="text-link"
                href="https://discord.com/users/1549177447726059524"
                target="_blank"
                rel="noopener noreferrer me"
                >@meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>
                <img
                  class="inline-icon"
                  src="icon.png"
                  alt=""
                  aria-hidden="true"
                />TeamSlag
              </h3>
              <a
                class="text-link"
                href="https://t.me/TeamSlag"
                target="_blank"
                rel="noopener noreferrer"
                >My organization <span aria-hidden="true">-&gt;</span></a
              >
            </article>
          </section>
        </main>
      </div>

      <footer class="footer">
        <p class="muted">
          <a
            class="text-link"
            href="https://github.com/meltude/meltude.github.io"

            rel="noopener"

          &middot;
          <a
            class="text-link"
            href="https://madmalik.github.io/mononoki/"
