<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="How to contact Meltude." />
    <link rel="icon" type="image/png" href="/img/icon.png" />
    <title>MeltudeContacts()</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="preload"
      href="/fonts/mononoki-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="canonical" href="https://meltude.me/contact" />
    <link
      rel="alternate"
      hreflang="en"
      href="https://meltude.me/contact"
    />
    <link
      rel="alternate"
      hreflang="ru"
      href="https://meltude.me/ru/contact"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://meltude.me/contact"
    />
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="page-shell">
      <div class="topbar-wrap">
        <nav class="workspaces" aria-label="Workspaces">
          <a href="/" title="Overview">1</a>
          <a href="/projects" title="Projects">2</a>
          <a href="/notes" title="Notes">3</a>
          <a href="/contact" aria-current="page" title="Contact">4</a>
          <a href="/credits" title="Credits">5</a>
        </nav>
        <div class="lang-switcher lang-switcher--compact lang-switcher--plain">
          <a
            href="/ru/contact"
            hreflang="ru"
            lang="ru"
            aria-label="Switch to Russian"
            >RU</a
          >
        </div>
      </div>

      <div class="layout">
        <main class="content">
          <section class="pane-grid" aria-label="Contact links">
            <h1 class="visually-hidden">Contacts</h1>
            <div class="section-divider">
              <h3>Contacts:</h3>
            </div>
            <article class="pane span-all">
              <h3>Links</h3>
              <p class="muted">How to reach me.</p>
              <ul class="chip-list">
                <li>
                  <a
                    href="https://codeberg.org/meltude"
                    target="_blank"
                    rel="noopener noreferrer me"
                    ><img
                      class="inline-icon"
                      src="img/icons/codeberg.svg"
                      alt=""
                      aria-hidden="true"
                      width="16"
                      height="16"
                      loading="lazy"
                    />codeberg.org/meltude</a
                  >
                </li>
                <li>
                  <a
                    href="https://github.com/meltude"
                    target="_blank"
                    rel="noopener noreferrer me"
                    ><img
                      class="inline-icon"
                      src="img/icons/github.svg"
                      alt=""
                      aria-hidden="true"
                      width="16"
                      height="16"
                      loading="lazy"
                    />github.com/meltude</a
                  >
                </li>
                <li>
                  <a
                    href="https://steamcommunity.com/id/Meltude/"
                    target="_blank"
                    rel="noopener noreferrer me"
                    ><img
                      class="inline-icon"
                      src="img/icons/steam.svg"
                      alt=""
                      aria-hidden="true"
                      width="16"
                      height="16"
                      loading="lazy"
                    />steamcommunity.com/id/Meltude/</a
                  >
                </li>
                <li>
                  <a
                    href="https://t.me/meltude"
                    target="_blank"
                    rel="noopener noreferrer me"
                    ><img
                      class="inline-icon"
                      src="img/icons/telegram.svg"
                      alt=""
                      aria-hidden="true"
                      width="16"
                      height="16"
                      loading="lazy"
                    />t.me/meltude</a
                  >
                </li>
                <li>
                  <a href="mailto:meltude@proton.me" rel="me"
                    ><img
                      class="inline-icon"
                      src="img/icons/protonmail.svg"
                      alt=""
                      aria-hidden="true"
                      width="16"
                      height="16"
                      loading="lazy"
                    />meltude@proton.me</a
                  >
                </li>
                <li>
                  <a
                    href="https://discord.com/users/1549177447726059524"
                    target="_blank"
                    rel="noopener noreferrer me"
                    ><img
                      class="inline-icon"
                      src="img/icons/discord.svg"
                      alt=""
                      aria-hidden="true"
                      width="16"
                      height="16"
                      loading="lazy"
                    />@meltude</a
                  >
                </li>
              </ul>
            </article>
          </section>
        </main>
      </div>

      <footer class="footer">
        <p class="muted">
          <a
            class="text-link"
            href="https://github.com/meltude/meltude.github.io"
            target="_blank"
            rel="noopener"
            >Source code</a
          >
          &middot;
          <a
            class="text-link"
            href="https://madmalik.github.io/mononoki/"
            target="_blank"
            rel="noopener"
            >Font</a
          >
        </p>
      </footer>
    </div>
    <script src="stars.js" defer></script>
  </body>
</html>
