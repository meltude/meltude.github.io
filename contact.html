<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="How to contact Meltude." />
    <link rel="icon" type="image/svg+xml" href="icon.png" />
    <title>MeltudeContacts()</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="preload"
      href="/fonts/mononoki-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="alternate"
      hreflang="en"
      href="https://meltude.me/contact.html"
    />
    <link
      rel="alternate"
      hreflang="ru"
      href="https://meltude.me/ru/contact.html"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://meltude.me/contact.html"
    />
  </head>
  <body>
    <div class="page-shell">
      <div class="topbar-wrap">
        <nav class="workspaces" aria-label="Workspaces">
          <a href="index.html" title="Overview">1</a>
          <a href="projects.html" title="Projects">2</a>
          <a href="notes.html" title="Notes">3</a>
          <a href="contact.html" aria-current="page" title="Contact">4</a>
          <a href="credits.html" title="Credits">5</a>
        </nav>
        <div class="lang-switcher lang-switcher--compact lang-switcher--plain">
          <a
            href="ru/contact.html"
            hreflang="ru"
            lang="ru"
            aria-label="Switch to Russian"
            >RU</a
          >
        </div>
      </div>

      <div class="layout">
        <main class="content">
          <section class="pane-grid" aria-label="Contact links">
            <div class="section-divider">
              <h3>Contacts:</h3>
            </div>
            <article class="pane">
              <h3>Codeberg</h3>
              <a
                class="text-link"
                href="https://codeberg.org/meltude"
                target="_blank"
                rel="noopener noreferrer me"
                >codeberg.org/meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>GitHub</h3>
              <a
                class="text-link"
                href="https://github.com/meltude"
                target="_blank"
                rel="noopener noreferrer me"
                >github.com/meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>Steam</h3>
              <a
                class="text-link"
                href="https://steamcommunity.com/id/Meltude/"
                target="_blank"
                rel="noopener noreferrer me"
                >steamcommunity.com/id/Meltude/
                <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>Telegram</h3>
              <a
                class="text-link"
                href="https://t.me/meltude"
                target="_blank"
                rel="noopener noreferrer me"
                >t.me/meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>Email</h3>
              <a class="text-link" href="mailto:meltude@proton.me"
                >meltude@proton.me <span aria-hidden="true">-&gt;</span></a
              >
            </article>

            <article class="pane">
              <h3>Discord</h3>
              <a
                class="text-link"
                href="https://discord.com/users/1549177447726059524"
                target="_blank"
                rel="noopener noreferrer me"
                >@meltude <span aria-hidden="true">-&gt;</span></a
              >
            </article>
          </section>
        </main>
      </div>

      <footer class="footer">
        <p class="muted">
          <a
            class="text-link"
            href="https://github.com/meltude/meltude.github.io"
            target="_blank"
            rel="noopener"
            >Source code</a
          >
          &middot;
          <a
            class="text-link"
            href="https://madmalik.github.io/mononoki/"
            target="_blank"
            rel="noopener"
            >Font</a
          >
        </p>
      </footer>
    </div>
  </body>
</html>
