<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      data-i18n-content="credits.meta.description"
      content="Credits and thanks to people who helped with meltude.me"
    />
    <link rel="icon" type="image/svg+xml" href="icon.png" />
    <title data-i18n="credits.meta.title">JustCredits()</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="ash-walker.css" />
    <link
      rel="preload"
      href="/fonts/mononoki-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div class="page-shell">
      <div class="topbar-wrap">
        <header class="topbar pane">
          <nav aria-label="Main navigation" data-i18n-aria-label="nav.label">
            <a href="index.html" data-i18n="nav.overview">Overview</a>
            <a href="projects.html" data-i18n="nav.projects">Projects</a>
            <a href="notes.html" data-i18n="nav.notes">Notes</a>
            <a href="contact.html" data-i18n="nav.contact">Contact</a>
            <a href="credits.html" aria-current="page" data-i18n="nav.credits">Credits</a>
          </nav>
        </header>
        <div class="lang-switcher lang-switcher--compact pane">
          <button id="lang-toggle" type="button" aria-label="Switch to Russian">
            RU
          </button>
        </div>
      </div>

      <div class="layout">
        <main class="content">
          <section
            class="pane-grid"
            aria-label="Credits to:"
            data-i18n-aria-label="credits.aria"
          >
            <div class="section-divider">
              <h3 data-i18n="credits.title">Credits to:</h3>
            </div>

            <article class="pane">
              <h3>
                <a
                  href="https://inuhepott.tech/"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Inuhepott <span aria-hidden="true">-&gt;</span></a
                >
              </h3>
            </article>

            <article class="pane">
              <h3>
                <a
                  href="https://samposa_1337.codeberg.page/"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Samposa1337 <span aria-hidden="true">-&gt;</span></a
                >
              </h3>
            </article>
          </section>
        </main>
      </div>

      <footer class="footer footer-badges">
        <div class="badge-row" aria-label="Friend badges">
          <a href="https://inu.vesperlinux.org">
            <img src="img/inuhepott.png" alt="inuhepott" loading="lazy" />
          </a>
          <a href="https://vesperlinux.org">
            <img src="img/vesperlinux.gif" alt="Vesper Linux" loading="lazy" />
          </a>
          <a href="https://meltude.me">
            <img src="img/MeltingAsh.jpg" alt="meltude.me" loading="lazy" />
          </a>
        </div>
        <p class="muted">
          <a
            class="text-link"
            href="https://github.com/meltude/meltude.github.io"
            target="_blank"
            rel="noopener"
            data-i18n="footer.source"
            >Source code</a
          >
          &middot;
          <a
            class="text-link"
            href="https://madmalik.github.io/mononoki/"
            target="_blank"
            rel="noopener"
            data-i18n="footer.font"
            >Font</a
          >
        </p>
      </footer>
    </div>
    <script src="i18n.js" defer></script>
  </body>
</html>
